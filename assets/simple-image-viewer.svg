<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e1b4b" flood-opacity=".45"/>
    </filter>
    <clipPath id="photo">
      <rect x="54" y="62" width="148" height="118" rx="10"/>
    </clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="116" rx="52" fill="url(#shine)"/>

  <!-- Foto mit weißem Rahmen -->
  <g filter="url(#shadow)" transform="rotate(-6 128 128)">
    <rect x="42" y="50" width="172" height="160" rx="16" fill="#fff"/>
    <g clip-path="url(#photo)">
      <rect x="54" y="62" width="148" height="118" fill="url(#sky)"/>
      <circle cx="160" cy="98" r="17" fill="#fffbeb"/>
      <path d="M54 180 L54 150 L96 106 L130 140 L150 122 L202 168 L202 180 Z" fill="url(#far)"/>
      <path d="M54 180 L54 162 L84 140 L118 166 L146 150 L202 180 Z" fill="url(#near)"/>
    </g>
  </g>
</svg>
